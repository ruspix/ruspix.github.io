<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPF Color generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <h1>
    🎨 PPF Color generator
    <small>made with ai</small>
  </h1>

  <!-- Поле никнейма -->
  <div class="input-group">
    <label for="nickInput">👤 Nickname</label>
    <input type="text" id="nickInput" placeholder="nof" autocomplete="off">
  </div>

  <div class="input-group">
    <label for="idInput">🔢 UID</label>
    <input type="number" id="idInput" placeholder="67" autocomplete="off">
  </div>

  <div class="preview-panel">
    <div class="preview-item">
      <div class="label">Preview box</div>
      <div class="preview-box">
        <span class="char-box" id="charDisplayLight">?</span>
        <span class="name-hex" id="lightNameDisplay">-</span>
      </div>
      <div class="preview-box" style="background: rgb(59, 59, 59)">
        <span class="char-box" id="charDisplayDark" style="background: #3e3e4f; color: white;">?</span>
        <span class="name-hex" id="darkNameDisplay" style="background: #434648;">-</span>
      </div>
    </div>
  </div>
</div>

<script src="ppf.js"></script>
<script src="script.js"></script>
</body>
</html>
